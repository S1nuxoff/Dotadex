<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Browse and inspect every Dota 2 hero, cosmetic, courier and ward model in 3D, with the game's hero shading and animations. A fan project; Dota 2 is a trademark of Valve Corporation." />
    <meta name="theme-color" content="#121a24" />
    <title>Dotadex: the complete Dota 2 encyclopedia in 3D</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3 28 10v12L16 29 4 22V10z' fill='%23c9a45c'/%3E%3C/svg%3E" />
    <link rel="preload" as="image" href="%BASE_URL%ui/dotadex-logo.png" />
    <style>
      /* The splash: the logo slammed down letter by letter on a forge-lit floor, shown from the
         first paint until the app has its catalog (window.DotadexLoader.hide) */
      #dx-loader {
        position: fixed; inset: 0; z-index: 9999;
        display: grid; place-items: center;
        padding: 0 16px;
        background:
          radial-gradient(120% 70% at 50% 115%, rgba(179,38,26,.35), transparent 60%),
          radial-gradient(80% 60% at 50% 50%, #12141a, #07080b 75%);
        transition: opacity .9s ease, visibility .9s;
      }
      #dx-loader.is-done { opacity: 0; visibility: hidden; }
      #dx-loader::after { /* vignette */
        content: ""; position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.75) 100%);
      }
      #dx-loader::before {
        content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0;
        background: radial-gradient(60% 45% at 50% 52%, rgba(200,50,25,.35), transparent 70%);
      }
      #dx-loader.pulse::before { animation: dx-pulse 1.6s ease-out forwards; }
      #dx-embers { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

      .dx-logo { position: relative; z-index: 2; width: min(873px, 100%); aspect-ratio: 873 / 113; }
      /* impact is shown by light, never by moving the logo */
      .dx-wave {
        position: absolute; left: 68%; top: 96%; width: 90%; height: 2px;
        translate: -50% 0; pointer-events: none; opacity: 0; scale: 0 1;
        background: linear-gradient(90deg, transparent, rgba(255,170,90,.95) 50%, transparent);
        box-shadow: 0 0 18px 4px rgba(255,90,30,.45);
      }
      .dx-wave.go { animation: dx-wave 1.1s cubic-bezier(.15,.7,.25,1) forwards; }

      .dx-l {
        position: absolute; inset: 0;
        background: var(--dx-logo) center / 100% 100% no-repeat;
        opacity: 0;
        will-change: transform, opacity, filter;
      }
      .dx-l.in { animation: dx-slam .6s cubic-bezier(.17,.84,.32,1.12) forwards; }
      .dx-l.red.in { animation: dx-slam-red .75s cubic-bezier(.17,.84,.32,1.12) forwards; }
      .dx-l.red.burn { opacity: 1; animation: dx-burn 2.4s ease-in-out infinite; }

      /* metallic sheen that travels across the stone, masked by the logo itself */
      .dx-sheen {
        position: absolute; inset: 0; pointer-events: none;
        -webkit-mask: var(--dx-logo) center / 100% 100% no-repeat;
                mask: var(--dx-logo) center / 100% 100% no-repeat;
        background: linear-gradient(105deg, transparent 40%, rgba(255,240,210,.85) 50%, transparent 60%) no-repeat;
        background-size: 250% 100%;
        background-position: 160% 0;
        mix-blend-mode: overlay;
        opacity: 0;
      }
      .dx-sheen.go { animation: dx-sheen 1.3s ease-in-out forwards; }

      .dx-flash {
        position: absolute; left: 68%; top: 50%; width: 40%; aspect-ratio: 1;
        translate: -50% -50%; border-radius: 50%; pointer-events: none;
        background: radial-gradient(circle, rgba(255,140,60,.55), rgba(179,38,26,.25) 40%, transparent 70%);
        opacity: 0; scale: .3;
      }
      .dx-flash.go { animation: dx-flash .9s ease-out forwards; }

      @keyframes dx-slam {
        0%   { opacity: 0; transform: translateY(-38%) scale(1.9); filter: blur(8px) brightness(2.4); }
        55%  { opacity: 1; transform: translateY(2%) scale(.95); filter: blur(0) brightness(1.7); }
        75%  { transform: translateY(-1%) scale(1.02); }
        100% { opacity: 1; transform: none; filter: brightness(1); }
      }
      @keyframes dx-slam-red {
        0%   { opacity: 0; transform: translateY(-50%) scale(2.4) rotate(-3deg); filter: blur(10px) brightness(3) saturate(1.6); }
        50%  { opacity: 1; transform: translateY(3%) scale(.93); filter: blur(0) brightness(2.2) drop-shadow(0 0 22px rgba(255,90,30,.9)); }
        72%  { transform: translateY(-1.5%) scale(1.03); }
        100% { opacity: 1; transform: none; filter: brightness(1) drop-shadow(0 0 8px rgba(255,70,20,.45)); }
      }
      @keyframes dx-burn {
        0%, 100% { filter: brightness(1) drop-shadow(0 0 6px rgba(255,70,20,.35)); }
        50%      { filter: brightness(1.18) drop-shadow(0 0 16px rgba(255,90,30,.7)); }
      }
      @keyframes dx-sheen {
        0%   { opacity: 1; background-position: 160% 0; }
        100% { opacity: 1; background-position: -60% 0; }
      }
      @keyframes dx-flash {
        0%   { opacity: 0; scale: .3; }
        20%  { opacity: 1; }
        100% { opacity: 0; scale: 1.8; }
      }
      @keyframes dx-wave {
        0%   { opacity: 0; scale: 0 1; }
        15%  { opacity: 1; }
        100% { opacity: 0; scale: 1 1; }
      }
      @keyframes dx-pulse {
        0%   { opacity: 0; }
        12%  { opacity: 1; }
        100% { opacity: 0; }
      }
      @keyframes dx-fade { to { opacity: 1; } }

      @media (prefers-reduced-motion: reduce) {
        .dx-l.in, .dx-l.red.in { animation: dx-fade .6s ease forwards; }
        .dx-l.red.burn { animation: none; filter: drop-shadow(0 0 8px rgba(255,70,20,.45)); }
        .dx-wave.go, #dx-loader.pulse::before, .dx-sheen.go, .dx-flash.go { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="dx-loader" role="status" aria-label="Loading Dotadex">
      <canvas id="dx-embers"></canvas>
      <div class="dx-logo" id="dx-logo" aria-hidden="true">
        <div class="dx-flash" id="dx-flash"></div>
        <div class="dx-wave" id="dx-wave"></div>
      </div>
    </div>
    <script>
      (() => {
        const W = 873, H = 113;
        // Letter cut-outs in source-image pixels. T and A overlap, so they get stepped polygons.
        const LETTERS = [
          { poly: [[0,0],[129,0],[129,113],[0,113]], cx: 61 },
          { poly: [[129,0],[272,0],[272,113],[129,113]], cx: 200 },
          { poly: [[272,0],[384,0],[384,40],[368,40],[368,113],[272,113]], cx: 330 },
          { poly: [[384,0],[511,0],[511,113],[368,113],[368,40],[384,40]], cx: 440 },
          { poly: [[511,0],[643,0],[643,113],[511,113]], cx: 577, red: true },
          { poly: [[643,0],[746,0],[746,113],[643,113]], cx: 693, red: true },
          { poly: [[746,0],[873,0],[873,113],[746,113]], cx: 813, red: true },
        ];
        // The splash stays at least until DEX has landed, however fast the catalog arrives
        const MIN_MS = 2400;
        const pct = (x, t) => (x / t * 100).toFixed(3) + "%";

        const start = performance.now();
        const loader = document.getElementById("dx-loader");
        const logo = document.getElementById("dx-logo");
        const flash = document.getElementById("dx-flash");
        const wave = document.getElementById("dx-wave");
        const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
        loader.style.setProperty("--dx-logo", 'url("%BASE_URL%ui/dotadex-logo.png")');

        const els = LETTERS.map((L) => {
          const d = document.createElement("div");
          d.className = "dx-l" + (L.red ? " red" : "");
          // push outer edges past the box so glows and blur aren't cut off
          const ex = (x) => (x === 0 ? -40 : x === W ? W + 40 : x);
          const ey = (y) => (y === 0 ? -50 : y === H ? H + 50 : y);
          d.style.clipPath = "polygon(" + L.poly.map(([x, y]) => pct(ex(x), W) + " " + pct(ey(y), H)).join(",") + ")";
          d.style.transformOrigin = pct(L.cx, W) + " 60%";
          logo.insertBefore(d, flash);
          return d;
        });
        const sheen = document.createElement("div");
        sheen.className = "dx-sheen";
        logo.appendChild(sheen);

        /* Embers and impact sparks */
        const cv = document.getElementById("dx-embers");
        const ctx = cv.getContext("2d");
        let dpr = 1, vw = 0, vh = 0;
        const parts = [];
        let burning = false;
        let running = true;

        function resize() {
          dpr = Math.min(devicePixelRatio || 1, 2);
          vw = cv.clientWidth; vh = cv.clientHeight;
          cv.width = vw * dpr; cv.height = vh * dpr;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        addEventListener("resize", resize);
        resize();

        function ember(x, y, burst) {
          const a = burst ? Math.random() * Math.PI * 2 : -Math.PI / 2 + (Math.random() - 0.5) * 0.6;
          const sp = burst ? 2 + Math.random() * 6 : 0.4 + Math.random() * 1.2;
          parts.push({
            x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (burst ? 1.5 : 0),
            life: 0, max: burst ? 40 + Math.random() * 40 : 140 + Math.random() * 160,
            r: burst ? 1 + Math.random() * 2 : 0.8 + Math.random() * 1.8,
            wob: Math.random() * 6.28, burst,
            hue: burst ? 20 + Math.random() * 25 : 12 + Math.random() * 28,
          });
        }

        function letterPoint(i, fy) {
          const r = logo.getBoundingClientRect(), c = cv.getBoundingClientRect();
          return { x: r.left - c.left + r.width * LETTERS[i].cx / W, y: r.top - c.top + r.height * fy, w: r.width };
        }

        function impact(i, big) {
          if (reduce) return;
          const p = letterPoint(i, 0.92);
          const n = big ? 46 : 18;
          for (let k = 0; k < n; k++) ember(p.x + (Math.random() - 0.5) * p.w * 0.1, p.y, true);
        }

        function tick() {
          if (!running) return;
          // ambient embers from the forge floor
          if (!reduce && Math.random() < 0.55) ember(Math.random() * vw, vh + 10, false);
          // DEX keeps smouldering once it has landed
          if (!reduce && burning && Math.random() < 0.5) {
            const i = 4 + Math.floor(Math.random() * 3);
            const p = letterPoint(i, 0.1);
            ember(p.x + (Math.random() - 0.5) * p.w * 0.12, p.y, false);
          }
          ctx.clearRect(0, 0, vw, vh);
          ctx.globalCompositeOperation = "lighter";
          for (let i = parts.length - 1; i >= 0; i--) {
            const q = parts[i];
            q.life++;
            if (q.burst) { q.vy += 0.18; q.vx *= 0.97; }
            else { q.wob += 0.05; q.vx += Math.sin(q.wob) * 0.02; }
            q.x += q.vx; q.y += q.vy;
            const t = q.life / q.max;
            if (t >= 1 || q.y < -20) { parts.splice(i, 1); continue; }
            const alpha = (t < 0.1 ? t / 0.1 : 1 - t) * (q.burst ? 1 : 0.8);
            const flick = 0.7 + Math.random() * 0.3;
            const g = ctx.createRadialGradient(q.x, q.y, 0, q.x, q.y, q.r * 4);
            g.addColorStop(0, `hsla(${q.hue + 20},100%,85%,${alpha * flick})`);
            g.addColorStop(0.35, `hsla(${q.hue},100%,55%,${alpha * 0.6 * flick})`);
            g.addColorStop(1, "hsla(10,100%,40%,0)");
            ctx.fillStyle = g;
            ctx.beginPath(); ctx.arc(q.x, q.y, q.r * 4, 0, Math.PI * 2); ctx.fill();
          }
          ctx.globalCompositeOperation = "source-over";
          requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);

        /* Sequence */
        const at = (ms, fn) => setTimeout(fn, ms);
        // D O T A: stone letters, quick cadence
        [0, 1, 2, 3].forEach((i, n) => {
          const t = 300 + n * 170;
          at(t, () => els[i].classList.add("in"));
          at(t + 330, () => impact(i, false));
        });
        // a beat, then D E X: fire letters, heavier
        [4, 5, 6].forEach((i, n) => {
          const t = 1250 + n * 150;
          at(t, () => els[i].classList.add("in"));
          at(t + 380, () => impact(i, true));
        });
        at(1250 + 2 * 150 + 380, () => {
          wave.classList.add("go");
          loader.classList.add("pulse");
          flash.classList.add("go");
          burning = true;
        });
        at(2200, () => sheen.classList.add("go"));
        at(2300, () => [4, 5, 6].forEach((i) => { els[i].classList.remove("in"); els[i].classList.add("burn"); }));

        let hidden = false;
        window.DotadexLoader = {
          // Fades the splash out (once DEX has landed) and drops it from the page
          hide() {
            if (hidden) return;
            hidden = true;
            at(Math.max(0, MIN_MS - (performance.now() - start)), () => {
              loader.classList.add("is-done");
              at(1000, () => {
                running = false;
                removeEventListener("resize", resize);
                loader.remove();
              });
            });
          },
        };
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
