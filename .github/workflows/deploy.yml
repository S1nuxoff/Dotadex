name: Deploy

on:
  push:
    branches: [main]
  schedule:
    # Picks up models exported since the last build
    - cron: "45 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Built and deployed in two jobs: deploy-pages lists the run's artifacts, and since 2026-11-21 the
# one uploaded a moment before in the same job is not in that list yet ("Found 0 artifact(s)");
# the deploy job starts on another runner, by which time it is
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build the model list
        run: npm run catalog
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
