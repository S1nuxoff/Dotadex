<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Browse and inspect every Dota 2 hero, cosmetic, courier and ward model in 3D, with the game's hero shading and animations. A fan project; Dota 2 is a trademark of Valve Corporation." />
    <meta name="theme-color" content="#121a24" />
    <title>Dotadex: the complete Dota 2 encyclopedia in 3D</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3 28 10v12L16 29 4 22V10z' fill='%23c9a45c'/%3E%3C/svg%3E" />
    <link rel="preload" as="image" href="%BASE_URL%ui/dotadex-logo.png" />
    <style>
      /* The splash: the logo slammed down letter by letter on a forge-lit floor, shown from the
         first paint until the app has its catalog (window.DotadexLoader.hide).
         The page's own script, the catalog and the first render all run while it plays, so every
         animation here is opacity or transform with its delay set up front, which the browser runs
         off the main thread; the glows are fixed filters on layers that only fade, and the embers
         are drawn in a worker */
      #dx-loader {
        position: fixed; inset: 0; z-index: 9999;
        display: grid; place-items: center;
        padding: 0 16px;
        background:
          radial-gradient(120% 70% at 50% 115%, rgba(179,38,26,.35), transparent 60%),
          radial-gradient(80% 60% at 50% 50%, #12141a, #07080b 75%);
        transition: opacity .9s ease, visibility .9s;
      }
      #dx-loader.is-done { opacity: 0; visibility: hidden; }
      #dx-loader::after { /* vignette */
        content: ""; position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.75) 100%);
      }
      #dx-loader::before { /* the red pulse once DEX has landed */
        content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0;
        background: radial-gradient(60% 45% at 50% 52%, rgba(200,50,25,.35), transparent 70%);
        animation: dx-pulse 1.2s ease-out 1.06s both;
      }
      #dx-embers { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

      .dx-logo { position: relative; z-index: 2; width: min(873px, 100%); aspect-ratio: 873 / 113; }

      /* One piece of the logo, clipped out of it (--d is its delay): D O T A are typed one by one,
         then DEX flies in whole and slams down. Under the plain face sits a white-hot copy that
         fades as the piece appears */
      .dx-l {
        position: absolute; inset: 0; opacity: 0;
        will-change: transform, opacity;
        animation: dx-type .14s ease-out var(--d) both;
      }
      .dx-l.red { animation: dx-slam-red .56s cubic-bezier(.17,.84,.32,1.12) var(--d) both; }
      .dx-face, .dx-hot {
        position: absolute; inset: 0;
        background: var(--dx-logo) center / 100% 100% no-repeat;
      }
      .dx-l.red .dx-face { filter: drop-shadow(0 0 8px rgba(255,70,20,.45)); }
      .dx-hot {
        filter: brightness(2.4);
        will-change: opacity;
        animation: dx-cool .3s ease-out var(--d) both;
      }
      .dx-l.red .dx-hot {
        filter: brightness(2.6) saturate(1.5) drop-shadow(0 0 22px rgba(255,90,30,.9));
        animation-duration: .56s;
      }

      /* metallic sheen that travels across the stone, masked by the logo itself */
      .dx-sheen {
        position: absolute; inset: 0; overflow: hidden; pointer-events: none;
        -webkit-mask: var(--dx-logo) center / 100% 100% no-repeat;
                mask: var(--dx-logo) center / 100% 100% no-repeat;
        mix-blend-mode: overlay;
      }
      .dx-sheen::before {
        content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 250%;
        background: linear-gradient(105deg, transparent 40%, rgba(255,240,210,.85) 50%, transparent 60%);
        transform: translateX(-96%);
        will-change: transform;
        animation: dx-sheen 1s ease-in-out 1.25s both;
      }

      /* impact is shown by light, never by moving the logo */
      .dx-wave {
        position: absolute; left: 68%; top: 96%; width: 90%; height: 2px;
        translate: -50% 0; pointer-events: none; opacity: 0; scale: 0 1;
        background: linear-gradient(90deg, transparent, rgba(255,170,90,.95) 50%, transparent);
        box-shadow: 0 0 18px 4px rgba(255,90,30,.45);
        animation: dx-wave .85s cubic-bezier(.15,.7,.25,1) 1.06s both;
      }
      .dx-flash {
        position: absolute; left: 79%; top: 50%; width: 40%; aspect-ratio: 1;
        translate: -50% -50%; border-radius: 50%; pointer-events: none;
        background: radial-gradient(circle, rgba(255,140,60,.55), rgba(179,38,26,.25) 40%, transparent 70%);
        opacity: 0; scale: .3;
        animation: dx-flash .7s ease-out 1.06s both;
      }

      @keyframes dx-type {
        0%   { opacity: 0; transform: translateY(4%) scale(1.08); }
        100% { opacity: 1; transform: none; }
      }
      @keyframes dx-slam-red {
        0%   { opacity: 0; transform: translateY(-50%) scale(2.4) rotate(-3deg); }
        50%  { opacity: 1; transform: translateY(3%) scale(.93); }
        72%  { transform: translateY(-1.5%) scale(1.03); }
        100% { opacity: 1; transform: none; }
      }
      @keyframes dx-cool {
        0%   { opacity: 1; }
        55%  { opacity: .5; }
        100% { opacity: 0; }
      }
      @keyframes dx-sheen {
        from { transform: translateX(-96%); }
        to   { transform: translateX(36%); }
      }
      @keyframes dx-flash {
        0%   { opacity: 0; scale: .3; }
        20%  { opacity: 1; }
        100% { opacity: 0; scale: 1.8; }
      }
      @keyframes dx-wave {
        0%   { opacity: 0; scale: 0 1; }
        15%  { opacity: 1; }
        100% { opacity: 0; scale: 1 1; }
      }
      @keyframes dx-pulse {
        0%   { opacity: 0; }
        12%  { opacity: 1; }
        100% { opacity: 0; }
      }
      @keyframes dx-fade { to { opacity: 1; } }

      @media (prefers-reduced-motion: reduce) {
        .dx-l, .dx-l.red { animation: dx-fade .6s ease var(--d) both; }
        .dx-hot { display: none; }
        .dx-wave, .dx-flash, .dx-sheen::before, #dx-loader::before { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="dx-loader" role="status" aria-label="Loading Dotadex">
      <canvas id="dx-embers"></canvas>
      <div class="dx-logo" id="dx-logo" aria-hidden="true">
        <div class="dx-flash"></div>
        <div class="dx-wave"></div>
      </div>
    </div>
    <script>
      (() => {
        const W = 873, H = 113;
        // Logo pieces in source-image pixels: the four letters of DOTA, then DEX as one. T and A
        // overlap, so they get stepped polygons. at: when the piece appears, in ms from the start
        const LETTERS = [
          { poly: [[0,0],[129,0],[129,113],[0,113]], cx: 61, at: 150 },
          { poly: [[129,0],[272,0],[272,113],[129,113]], cx: 200, at: 270 },
          { poly: [[272,0],[384,0],[384,40],[368,40],[368,113],[272,113]], cx: 330, at: 390 },
          { poly: [[384,0],[511,0],[511,113],[368,113],[368,40],[384,40]], cx: 440, at: 510 },
          { poly: [[511,0],[873,0],[873,113],[511,113]], cx: 692, at: 780, red: true },
        ];
        // DEX lands this long after it sets off, where its sparks fly and the light hits
        const LAND_MS = 285;
        const DEX = LETTERS[4];
        // The splash stays at least until DEX has landed, however fast the catalog arrives
        const MIN_MS = 1400;
        const pct = (x, t) => (x / t * 100).toFixed(3) + "%";

        const start = performance.now();
        const loader = document.getElementById("dx-loader");
        const logo = document.getElementById("dx-logo");
        const cv = document.getElementById("dx-embers");
        const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
        loader.style.setProperty("--dx-logo", 'url("%BASE_URL%ui/dotadex-logo.png")');

        const els = LETTERS.map((L) => {
          const d = document.createElement("div");
          d.className = "dx-l" + (L.red ? " red" : "");
          // push outer edges past the box so glows aren't cut off
          const ex = (x) => (x === 0 ? -40 : x === W ? W + 40 : x);
          const ey = (y) => (y === 0 ? -50 : y === H ? H + 50 : y);
          d.style.clipPath = "polygon(" + L.poly.map(([x, y]) => pct(ex(x), W) + " " + pct(ey(y), H)).join(",") + ")";
          d.style.transformOrigin = pct(L.cx, W) + " 60%";
          d.style.setProperty("--d", L.at + "ms");
          d.innerHTML = '<div class="dx-face"></div><div class="dx-hot"></div>';
          logo.insertBefore(d, logo.querySelector(".dx-flash"));
          return d;
        });
        logo.insertAdjacentHTML("beforeend", '<div class="dx-sheen"></div>');

        /* Embers and impact sparks: a worker draws them on the canvas handed over to it, so a busy
           page does not stall them. The same code runs on the page where that is not possible */
        function emberEngine(scope) {
          const W = 873;
          const now = () => performance.timeOrigin + performance.now();
          const frame = typeof requestAnimationFrame === "function" ? (fn) => requestAnimationFrame(fn) : (fn) => setTimeout(fn, 16);
          // burning: the span of DEX, in source-image pixels, once it has landed
          let cv, ctx, vw = 0, vh = 0, rect = null, reduce = false, burning = null, running = true;
          const parts = [];

          // An ember is one pre-drawn glow sprite per hue band, not a fresh gradient every frame
          const S = 64, HUES = 8, sprites = [];
          for (let k = 0; k < HUES; k++) {
            const hue = 12 + k * 33 / (HUES - 1);
            const c = typeof OffscreenCanvas === "function" ? new OffscreenCanvas(S, S) : Object.assign(document.createElement("canvas"), { width: S, height: S });
            const g2 = c.getContext("2d");
            const g = g2.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
            g.addColorStop(0, "hsla(" + (hue + 20) + ",100%,85%,1)");
            g.addColorStop(0.35, "hsla(" + hue + ",100%,55%,.6)");
            g.addColorStop(1, "hsla(10,100%,40%,0)");
            g2.fillStyle = g;
            g2.fillRect(0, 0, S, S);
            sprites.push(c);
          }

          function ember(x, y, burst) {
            const a = burst ? Math.random() * Math.PI * 2 : -Math.PI / 2 + (Math.random() - 0.5) * 0.6;
            const sp = burst ? 2 + Math.random() * 6 : 0.4 + Math.random() * 1.2;
            const hue = burst ? 20 + Math.random() * 25 : 12 + Math.random() * 28;
            parts.push({
              x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (burst ? 1.5 : 0),
              life: 0, max: burst ? 40 + Math.random() * 40 : 140 + Math.random() * 160,
              r: burst ? 1 + Math.random() * 2 : 0.8 + Math.random() * 1.8,
              wob: Math.random() * 6.28, burst,
              sprite: sprites[Math.round((hue - 12) / 33 * (HUES - 1))],
            });
          }

          // A random point across [x0, x1] of the logo (source-image pixels), fy down its height
          function logoPoint(x0, x1, fy) {
            return { x: rect.left + rect.width * (x0 + Math.random() * (x1 - x0)) / W, y: rect.top + rect.height * fy };
          }

          function impact(x0, x1, n) {
            if (reduce || !rect) return;
            for (let k = 0; k < n; k++) {
              const p = logoPoint(x0, x1, 0.92);
              ember(p.x, p.y, true);
            }
          }

          function tick() {
            if (!running) return;
            // ambient embers from the forge floor
            if (!reduce && Math.random() < 0.55) ember(Math.random() * vw, vh + 10, false);
            // DEX keeps smouldering once it has landed
            if (!reduce && burning && rect && Math.random() < 0.5) {
              const p = logoPoint(burning[0], burning[1], 0.1);
              ember(p.x, p.y, false);
            }
            ctx.clearRect(0, 0, vw, vh);
            ctx.globalCompositeOperation = "lighter";
            for (let i = parts.length - 1; i >= 0; i--) {
              const q = parts[i];
              q.life++;
              if (q.burst) { q.vy += 0.18; q.vx *= 0.97; }
              else { q.wob += 0.05; q.vx += Math.sin(q.wob) * 0.02; }
              q.x += q.vx; q.y += q.vy;
              const t = q.life / q.max;
              if (t >= 1 || q.y < -20) { parts.splice(i, 1); continue; }
              ctx.globalAlpha = (t < 0.1 ? t / 0.1 : 1 - t) * (q.burst ? 1 : 0.8) * (0.7 + Math.random() * 0.3);
              const s = q.r * 8;
              ctx.drawImage(q.sprite, q.x - s / 2, q.y - s / 2, s, s);
            }
            ctx.globalAlpha = 1;
            ctx.globalCompositeOperation = "source-over";
            frame(tick);
          }

          scope.onmessage = ({ data }) => {
            if (data.type === "init") {
              cv = data.canvas;
              ctx = cv.getContext("2d");
              reduce = data.reduce;
              frame(tick);
            } else if (data.type === "size") {
              vw = data.w; vh = data.h; rect = data.rect;
              cv.width = vw * data.dpr; cv.height = vh * data.dpr;
              ctx.setTransform(data.dpr, 0, 0, data.dpr, 0, 0);
            } else if (data.type === "start") {
              // data.t0 is when the letters' animations began, on the shared wall clock
              const at = (ms, fn) => setTimeout(fn, Math.max(0, data.t0 + ms - now()));
              at(data.landAt, () => {
                impact(data.span[0], data.span[1], 90);
                burning = data.span;
              });
            } else if (data.type === "stop") {
              running = false;
            }
          };
        }

        let embers;
        try {
          if (!cv.transferControlToOffscreen || !window.Worker) throw new Error("no offscreen canvas");
          const url = URL.createObjectURL(new Blob(["(" + emberEngine + ")(self)"], { type: "text/javascript" }));
          const worker = new Worker(url);
          const canvas = cv.transferControlToOffscreen();
          worker.postMessage({ type: "init", canvas, reduce }, [canvas]);
          embers = { send: (m) => worker.postMessage(m), close: () => { worker.terminate(); URL.revokeObjectURL(url); } };
        } catch {
          const scope = {};
          emberEngine(scope);
          scope.onmessage({ data: { type: "init", canvas: cv, reduce } });
          embers = { send: (m) => scope.onmessage({ data: m }), close: () => {} };
        }

        function sendSize() {
          const c = cv.getBoundingClientRect(), r = logo.getBoundingClientRect();
          embers.send({
            type: "size", w: c.width, h: c.height, dpr: Math.min(devicePixelRatio || 1, 2),
            rect: { left: r.left - c.left, top: r.top - c.top, width: r.width, height: r.height },
          });
        }
        addEventListener("resize", sendSize);
        sendSize();

        // Sparks follow the letters from the moment their animations actually started, which can be
        // later than now when the page's script holds up the first frame
        const first = els[0].getAnimations?.()[0];
        (first ? first.ready : Promise.resolve()).then(() => {
          const began = first && first.startTime != null ? first.startTime : performance.now();
          const span = [DEX.poly[0][0], DEX.poly[1][0]];
          embers.send({ type: "start", t0: performance.timeOrigin + began, landAt: DEX.at + LAND_MS, span });
        });

        let hidden = false;
        window.DotadexLoader = {
          // Fades the splash out (once DEX has landed) and drops it from the page
          hide() {
            if (hidden) return;
            hidden = true;
            setTimeout(() => {
              loader.classList.add("is-done");
              setTimeout(() => {
                embers.send({ type: "stop" });
                embers.close();
                removeEventListener("resize", sendSize);
                loader.remove();
              }, 1000);
            }, Math.max(0, MIN_MS - (performance.now() - start)));
          },
        };
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
