<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Browse and inspect every Dota 2 hero, cosmetic, courier and ward model in 3D, with the game's hero shading and animations. A fan project; Dota 2 is a trademark of Valve Corporation." />
    <meta name="theme-color" content="#121a24" />
    <title>Dotadex: the complete Dota 2 encyclopedia in 3D</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3 28 10v12L16 29 4 22V10z' fill='%23c9a45c'/%3E%3C/svg%3E" />
    <link rel="preload" as="image" type="image/webp" href="%BASE_URL%ui/dotadex-logo.webp" />
    <link rel="preload" as="image" type="image/webp" href="%BASE_URL%ui/dotadex-logo-dex.webp" />
    <style>
      /* The splash, shown from the first paint until the app has its catalog
         (window.DotadexLoader.hide). A slow push-in on the logo as it comes up out of the dark under a
         warm light that passes across it; then DEX ignites and a sheen crosses the finished logo.
         The page's own script, the catalog and the first render all run while it plays, so every
         animation here is opacity or transform with its delay set up front, which the browser runs
         off the main thread; the glows are fixed filters on layers that only fade, and the sparks
         are drawn in a worker. All times are in ms from the start */
      #dx-loader {
        position: fixed; inset: 0; z-index: 9999;
        display: grid; place-items: center;
        padding: 0 16px;
        overflow: hidden;
        background:
          radial-gradient(120% 70% at 50% 115%, rgba(179,38,26,.3), transparent 60%),
          radial-gradient(80% 60% at 50% 50%, #12141a, #06070a 75%);
        transition: opacity .9s ease, visibility .9s;
      }
      #dx-loader.is-done { opacity: 0; visibility: hidden; }
      /* An embed with ?bg=0: clear from the first paint, before the app (no stage dark while it loads) */
      html.dx-clear, html.dx-clear body, html.dx-clear #root { background: transparent !important; color-scheme: dark; }
      #dx-loader::after { /* vignette */
        content: ""; position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,.8) 100%);
      }
      #dx-loader::before { /* the red pulse as DEX ignites */
        content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0;
        background: radial-gradient(60% 45% at 62% 50%, rgba(220,60,25,.4), transparent 70%);
        animation: dx-pulse 1.4s ease-out 1.3s both;
      }
      #dx-embers { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }

      /* The camera: a slow push-in for the whole sequence, and a small kick when DEX ignites */
      .dx-cam {
        position: relative; z-index: 2;
        width: min(920px, 100%);
        will-change: transform;
        animation: dx-push 2.8s cubic-bezier(.16,.8,.24,1) both;
      }
      .dx-logo {
        position: relative; width: 100%; aspect-ratio: 2164 / 376;
        will-change: transform;
        animation: dx-kick .5s ease-out 1.3s both;
      }
      .dx-logo > * { position: absolute; inset: 0; pointer-events: none; }
      .dx-art { background: var(--dx-logo) center / 100% 100% no-repeat; }

      /* the fire behind the logo, rising as the logo comes up */
      .dx-back {
        inset: -70% -12%;
        background: radial-gradient(closest-side, rgba(255,90,30,.28), rgba(179,38,26,.12) 55%, transparent);
        opacity: 0;
        will-change: opacity;
        animation: dx-fade 1.2s ease-out .1s both;
      }
      .dx-logo > .dx-art { opacity: 0; will-change: opacity; animation: dx-fade .7s ease-out .15s both; }

      /* the logo comes up from the dark: a black copy of it (the logo as mask) lifts away while a
         broad warm light crosses the letters */
      .dx-shade {
        background: #000;
        -webkit-mask: var(--dx-logo) center / 100% 100% no-repeat;
                mask: var(--dx-logo) center / 100% 100% no-repeat;
        opacity: .85;
        will-change: opacity;
        animation: dx-lift 1s ease-in-out .35s both;
      }
      .dx-light {
        overflow: hidden;
        -webkit-mask: var(--dx-logo) center / 100% 100% no-repeat;
                mask: var(--dx-logo) center / 100% 100% no-repeat;
        mix-blend-mode: screen;
      }
      .dx-light::before {
        content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 250%;
        background: linear-gradient(100deg, transparent 32%, rgba(255,150,70,.35) 45%, rgba(255,225,180,.6) 50%, rgba(255,150,70,.35) 55%, transparent 68%);
        transform: translateX(-96%);
        will-change: transform;
        animation: dx-sheen 1s cubic-bezier(.45,0,.35,1) .35s both;
      }

      /* DEX alone (its red pixels), white-hot and glowing as it ignites, settling to a warm glow */
      .dx-dex {
        background: var(--dx-dex) center / 100% 100% no-repeat;
        filter: brightness(1.9) saturate(1.3) drop-shadow(0 0 14px rgba(255,90,30,.95)) drop-shadow(0 0 40px rgba(255,50,10,.55));
        opacity: 0;
        will-change: opacity;
        animation: dx-ignite 1.1s ease-out 1.3s both;
      }

      /* the burst of light at DEX and the line of light under the logo */
      .dx-flash {
        inset: auto; left: 77.5%; top: 50%; width: 45%; aspect-ratio: 1;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255,210,150,.7), rgba(255,90,30,.3) 35%, transparent 70%);
        opacity: 0;
        transform: translate(-50%, -50%) scale(.3);
        animation: dx-flash .8s ease-out 1.3s both;
      }
      .dx-wave {
        inset: auto; left: 77.5%; top: 97%; width: 110%; height: 2px;
        background: linear-gradient(90deg, transparent, rgba(255,180,100,.95) 50%, transparent);
        box-shadow: 0 0 18px 4px rgba(255,90,30,.45);
        opacity: 0;
        transform: translateX(-50%) scaleX(0);
        animation: dx-wave .9s cubic-bezier(.15,.7,.25,1) 1.3s both;
      }

      /* a sheen across the finished metal, masked by the logo itself */
      .dx-sheen {
        overflow: hidden;
        -webkit-mask: var(--dx-logo) center / 100% 100% no-repeat;
                mask: var(--dx-logo) center / 100% 100% no-repeat;
        mix-blend-mode: overlay;
      }
      .dx-sheen::before {
        content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 250%;
        background: linear-gradient(105deg, transparent 40%, rgba(255,240,210,.9) 50%, transparent 60%);
        transform: translateX(-96%);
        will-change: transform;
        animation: dx-sheen 1.1s ease-in-out 1.65s both;
      }

      @keyframes dx-push {
        from { transform: scale(1.16); }
        to   { transform: none; }
      }
      @keyframes dx-kick {
        0%   { transform: none; }
        25%  { transform: scale(1.03); }
        100% { transform: none; }
      }
      @keyframes dx-lift {
        from { opacity: .85; }
        to   { opacity: 0; }
      }
      @keyframes dx-ignite {
        0%   { opacity: 0; }
        9%   { opacity: 1; }
        100% { opacity: .3; }
      }
      @keyframes dx-flash {
        0%   { opacity: 0; transform: translate(-50%, -50%) scale(.3); }
        18%  { opacity: 1; }
        100% { opacity: 0; transform: translate(-50%, -50%) scale(1.9); }
      }
      @keyframes dx-wave {
        0%   { opacity: 0; transform: translateX(-50%) scaleX(0); }
        15%  { opacity: 1; }
        100% { opacity: 0; transform: translateX(-50%) scaleX(1); }
      }
      @keyframes dx-pulse {
        0%   { opacity: 0; }
        12%  { opacity: 1; }
        100% { opacity: 0; }
      }
      @keyframes dx-sheen {
        from { transform: translateX(-96%); }
        to   { transform: translateX(36%); }
      }
      @keyframes dx-fade { from { opacity: 0; } to { opacity: 1; } }

      @media (prefers-reduced-motion: reduce) {
        .dx-cam, .dx-logo, .dx-back, .dx-shade, .dx-light::before, .dx-flash, .dx-wave, .dx-sheen::before,
        #dx-loader::before { animation: none; }
        .dx-shade, .dx-light, .dx-flash, .dx-wave, .dx-sheen { display: none; }
        .dx-back { opacity: 1; }
        .dx-logo > .dx-art { animation: dx-fade .6s ease both; }
        .dx-dex { animation: dx-fade .6s ease both; opacity: .3; }
      }
    </style>
  </head>
  <body>
    <div id="dx-loader" role="status" aria-label="Loading Dotadex">
      <canvas id="dx-embers"></canvas>
      <div class="dx-cam">
        <div class="dx-logo" id="dx-logo" aria-hidden="true">
          <div class="dx-back"></div>
          <div class="dx-art"></div>
          <div class="dx-shade"></div>
          <div class="dx-light"></div>
          <div class="dx-dex"></div>
          <div class="dx-sheen"></div>
          <div class="dx-flash"></div>
          <div class="dx-wave"></div>
        </div>
      </div>
    </div>
    <script>
      (() => {
        // A frame on another site (/embed/...) goes without the splash: the stage's dark until its
        // scene comes, each time it is opened
        if (/\/embed\//.test(location.pathname)) {
          if (new URLSearchParams(location.search).get("bg") === "0") document.documentElement.classList.add("dx-clear");
          document.getElementById("dx-loader").remove();
          window.DotadexLoader = { hide() {} };
          return;
        }
        // The sequence, in ms from the start: DEX ignites once the logo has come up
        // the camera's push-in (.dx-cam): from this scale down to 1
        const PUSH = { dur: 2800, from: 1.16 };
        const IGNITE = 1300;
        // DEX across the logo, as fractions of its width
        const DEX = [0.552, 0.997];
        // The splash stays at least until DEX has ignited and the sheen has crossed, however fast
        // the catalog arrives
        const MIN_MS = 2400;

        const start = performance.now();
        const loader = document.getElementById("dx-loader");
        const logo = document.getElementById("dx-logo");
        const cv = document.getElementById("dx-embers");
        const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
        loader.style.setProperty("--dx-logo", 'url("%BASE_URL%ui/dotadex-logo.webp")');
        loader.style.setProperty("--dx-dex", 'url("%BASE_URL%ui/dotadex-logo-dex.webp")');

        /* Sparks: embers off the forge floor, a burst when DEX ignites, then DEX smouldering. A
           worker draws them on the canvas handed over to it, so a busy page does not stall them;
           the same code runs on the page where that is not possible */
        function emberEngine(scope) {
          const now = () => performance.timeOrigin + performance.now();
          const frame = typeof requestAnimationFrame === "function" ? (fn) => requestAnimationFrame(fn) : (fn) => setTimeout(fn, 16);
          // CSS's cubic-bezier() timing functions, so sparks keep to the page's animations
          const bezier = (x1, y1, x2, y2) => (t) => {
            const f = (a, b, u) => 3 * (1 - u) * (1 - u) * u * a + 3 * (1 - u) * u * u * b + u * u * u;
            let lo = 0, hi = 1, u = t;
            for (let i = 0; i < 24; i++) {
              u = (lo + hi) / 2;
              if (f(x1, x2, u) < t) lo = u; else hi = u;
            }
            return f(y1, y2, u);
          };
          const pushEase = bezier(0.16, 0.8, 0.24, 1);
          let cv, ctx, vw = 0, vh = 0, rect = null, reduce = false, running = true;
          // push: the camera's, on the wall clock; burning: the span of DEX once it has ignited
          let push = null, burning = null;
          const parts = [];

          // A spark is one pre-drawn glow sprite per hue band, not a fresh gradient every frame
          const S = 64, HUES = 8, sprites = [];
          for (let k = 0; k < HUES; k++) {
            const hue = 12 + k * 33 / (HUES - 1);
            const c = typeof OffscreenCanvas === "function" ? new OffscreenCanvas(S, S) : Object.assign(document.createElement("canvas"), { width: S, height: S });
            const g2 = c.getContext("2d");
            const g = g2.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
            g.addColorStop(0, "hsla(" + (hue + 20) + ",100%,85%,1)");
            g.addColorStop(0.35, "hsla(" + hue + ",100%,55%,.6)");
            g.addColorStop(1, "hsla(10,100%,40%,0)");
            g2.fillStyle = g;
            g2.fillRect(0, 0, S, S);
            sprites.push(c);
          }
          const sprite = (hue) => sprites[Math.max(0, Math.min(HUES - 1, Math.round((hue - 12) / 33 * (HUES - 1))))];

          // kind: "drift" rises slowly and sways, "burst" flies out and falls
          function spark(x, y, kind, angle, speed, life, r, hue) {
            parts.push({
              x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
              life: 0, max: life, r, wob: Math.random() * 6.28, burst: kind === "burst", sprite: sprite(hue),
            });
          }
          const drift = (x, y) => spark(x, y, "drift", -Math.PI / 2 + (Math.random() - 0.5) * 0.6, 0.4 + Math.random() * 1.2,
            140 + Math.random() * 160, 0.8 + Math.random() * 1.8, 12 + Math.random() * 28);

          // A point at fraction (fx, fy) of the logo, as far as the camera has pushed in by now
          function at(fx, fy) {
            let s = 1;
            if (push) {
              const k = Math.min(1, Math.max(0, (now() - push.s) / push.dur));
              s = push.from + (1 - push.from) * pushEase(k);
            }
            return { x: rect.left + rect.width * (0.5 + (fx - 0.5) * s), y: rect.top + rect.height * (0.5 + (fy - 0.5) * s) };
          }

          function tick() {
            if (!running) return;
            if (!reduce) {
              // embers from the forge floor
              if (Math.random() < 0.55) drift(Math.random() * vw, vh + 10);
              // DEX keeps smouldering once it has ignited
              if (burning && rect && Math.random() < 0.6) {
                const p = at(burning[0] + Math.random() * (burning[1] - burning[0]), 0.05);
                drift(p.x, p.y);
              }
            }
            ctx.clearRect(0, 0, vw, vh);
            ctx.globalCompositeOperation = "lighter";
            for (let i = parts.length - 1; i >= 0; i--) {
              const q = parts[i];
              q.life++;
              if (q.burst) { q.vy += 0.16; q.vx *= 0.97; }
              else { q.wob += 0.05; q.vx += Math.sin(q.wob) * 0.02; }
              q.x += q.vx; q.y += q.vy;
              const k = q.life / q.max;
              if (k >= 1 || q.y < -20) { parts.splice(i, 1); continue; }
              ctx.globalAlpha = (k < 0.1 ? k / 0.1 : 1 - k) * (q.burst ? 1 : 0.8) * (0.7 + Math.random() * 0.3);
              const s = q.r * 8;
              ctx.drawImage(q.sprite, q.x - s / 2, q.y - s / 2, s, s);
            }
            ctx.globalAlpha = 1;
            ctx.globalCompositeOperation = "source-over";
            frame(tick);
          }

          function ignite(span) {
            burning = span;
            if (reduce || !rect) return;
            for (let k = 0; k < 130; k++) {
              const p = at(span[0] + Math.random() * (span[1] - span[0]), 0.1 + Math.random() * 0.85);
              spark(p.x, p.y, "burst", Math.random() * Math.PI * 2, 2 + Math.random() * 7, 40 + Math.random() * 45,
                1 + Math.random() * 2, 20 + Math.random() * 25);
            }
          }

          scope.onmessage = ({ data }) => {
            if (data.type === "init") {
              cv = data.canvas;
              ctx = cv.getContext("2d");
              reduce = data.reduce;
              frame(tick);
            } else if (data.type === "size") {
              vw = data.w; vh = data.h; rect = data.rect;
              cv.width = vw * data.dpr; cv.height = vh * data.dpr;
              ctx.setTransform(data.dpr, 0, 0, data.dpr, 0, 0);
            } else if (data.type === "start") {
              // data.t0 is when the page's animations began, on the shared wall clock
              push = { s: data.t0, dur: data.push.dur, from: data.push.from };
              setTimeout(() => ignite(data.dex), Math.max(0, data.t0 + data.ignite - now()));
            } else if (data.type === "stop") {
              running = false;
            }
          };
        }

        let embers;
        try {
          if (!cv.transferControlToOffscreen || !window.Worker) throw new Error("no offscreen canvas");
          const url = URL.createObjectURL(new Blob(["(" + emberEngine + ")(self)"], { type: "text/javascript" }));
          const worker = new Worker(url);
          const canvas = cv.transferControlToOffscreen();
          worker.postMessage({ type: "init", canvas, reduce }, [canvas]);
          embers = { send: (m) => worker.postMessage(m), close: () => { worker.terminate(); URL.revokeObjectURL(url); } };
        } catch {
          const scope = {};
          emberEngine(scope);
          scope.onmessage({ data: { type: "init", canvas: cv, reduce } });
          embers = { send: (m) => scope.onmessage({ data: m }), close: () => {} };
        }

        // The logo's box once the push-in has settled; the worker scales it by the push itself
        function sendSize() {
          const c = cv.getBoundingClientRect();
          const w = logo.offsetWidth, h = logo.offsetHeight;
          embers.send({
            type: "size", w: c.width, h: c.height, dpr: Math.min(devicePixelRatio || 1, 2),
            rect: { left: (c.width - w) / 2, top: (c.height - h) / 2, width: w, height: h },
          });
        }
        addEventListener("resize", sendSize);
        sendSize();

        // Sparks follow the animations from the moment they actually started, which can be later
        // than now when the page's script holds up the first frame
        const first = document.querySelector(".dx-cam").getAnimations?.()[0];
        (first ? first.ready : Promise.resolve()).then(() => {
          const began = first && first.startTime != null ? first.startTime : performance.now();
          embers.send({ type: "start", t0: performance.timeOrigin + began, push: PUSH, ignite: IGNITE, dex: DEX });
        });

        let hidden = false;
        window.DotadexLoader = {
          // Fades the splash out (once the sequence has played) and drops it from the page
          hide() {
            if (hidden) return;
            hidden = true;
            setTimeout(() => {
              loader.classList.add("is-done");
              setTimeout(() => {
                embers.send({ type: "stop" });
                embers.close();
                removeEventListener("resize", sendSize);
                loader.remove();
              }, 1000);
            }, Math.max(0, MIN_MS - (performance.now() - start)));
          },
        };
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
